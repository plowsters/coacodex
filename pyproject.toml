[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coa-meta-analyzer"
version = "0.1.0"
description = "Ascension Conquest of Azeroth Phase 1 theorycraft meta analyzer"
readme = "docs/README.md"
requires-python = ">=3.11"
authors = [
  {name = "CoA Meta Analyzer contributors"}
]
dependencies = []

[project.scripts]
coa-meta = "coa_meta.cli:main"

[tool.setuptools]
packages = ["coa_meta", "coa_meta.combat", "coa_client_extract"]

[tool.setuptools.package-data]
# RECURSIVE on purpose (`**` needs setuptools >= 62.3, and the build requires >= 68). The prior
# `coa_client_extract = ["data/*.json"]` matched one directory level, so `data/generation_contracts/`
# — the hash-pinned generation-contract registry the publication layer loads at import — shipped in no
# wheel at all, and `coa_meta/data/live_sanity_watchlist.json` was omitted the same way. An editable
# install cannot expose either defect, because it puts the whole source tree on the path.
# `tests/test_package_metadata.py` holds these patterns to the tracked `data/` tree, and CI's `wheel`
# job proves the built artifact really carries the files rather than trusting the glob.
coa_meta = ["data/**/*.json"]
coa_client_extract = ["data/**/*.json"]

[tool.pytest.ini_options]
addopts = "-m 'not stormlib and not client'"
markers = [
  "stormlib: requires a built/installed StormLib shared library (native integration tier)",
  "client: requires the local Ascension client install (acceptance tier)",
]
