name: CI

# Runs on EVERY branch push and on pull requests. A main-only push filter meant a feature branch could
# accumulate weeks of work without CI ever executing — E0R.1 T6.1 makes the branch the thing CI guards.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # actions/checkout defaults to fetch-depth: 1, which leaves the merge base absent — so the
          # contract-immutability check (a shipped generation-contract revision file may never be
          # edited, T1.1) has nothing to diff against and cannot run at all.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the Python package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run the synthetic Python suite
        # BARE `pytest` on purpose: `python -m pytest` puts the CWD on sys.path and would mask the
        # import/packaging defect a fresh clone hits (T6.1). pyproject addopts already excludes the
        # `stormlib` + `client` markers (native / real-client acceptance tiers), which are run locally
        # against a real Ascension install, never in CI.
        run: pytest -q

      - name: Run the E0R.1 contract probes explicitly
        # Named separately so a collection or marker mistake that silently skips the milestone's own
        # enforcement tests shows up as a red step rather than as a quietly smaller suite.
        run: pytest -q tests/test_e0r1_*.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm --prefix coa_scraper ci

      - name: Run the Node suite
        # `npm test` is `unit-test && validate`. CI ran `run unit-test`, so validate-normalized.mjs —
        # the check over the committed normalized data — had never been a merge gate at all.
        run: npm --prefix coa_scraper test
